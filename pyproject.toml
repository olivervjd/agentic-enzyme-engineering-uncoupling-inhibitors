[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herbicide-desensitization-agent"
version = "0.1.0"
description = "Review-gated prototype for fixed-scope Arabidopsis target desensitization workflows"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
structure = ["biopython>=1.83", "numpy>=1.26", "tmtools>=0.2"]
reports = ["matplotlib>=3.8"]
calibration = ["biopython>=1.83", "numpy>=1.26", "tmtools>=0.2", "rdkit>=2024.3"]
chemistry = ["dimorphite_dl==2.0.2", "rdkit>=2024.3"]

[tool.setuptools.package-data]
"herbicide_desensitization_agent.app.registry" = ["*.yaml", "*.json"]

[tool.setuptools.packages.find]
include = ["herbicide_desensitization_agent*"]
